name: CloudDeploy Continuous Deployment (CD)

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  build-and-deploy:
    name: Build Containers, Publish to Registry & Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: []

    permissions:
      contents: read
      id-token: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # Registry Authentication: AWS ECR or Docker Hub
      # ----------------------------------------------------
      - name: 2a. Configure AWS Credentials (if configured)
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: 2b. Authenticate to Amazon ECR (if configured)
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 2c. Authenticate to Docker Hub (if configured)
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ----------------------------------------------------
      # Image Tags & Metadata Computation
      # ----------------------------------------------------
      - name: 3. Set Commit Metadata & Target Image Tags
        id: meta
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

          # Determine registry prefix: ECR > Docker Hub > Default org
          if [ -n "${{ steps.login-ecr.outputs.registry }}" ]; then
            REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          elif [ -n "${{ secrets.ECR_REPOSITORY }}" ]; then
            REGISTRY="${{ secrets.ECR_REPOSITORY }}"
          elif [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
            REGISTRY="${{ secrets.DOCKER_USERNAME }}"
          else
            REGISTRY="clouddeploy"
          fi

          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "backend_tag_latest=$REGISTRY/clouddeploy-backend:latest" >> $GITHUB_OUTPUT
          echo "backend_tag_sha=$REGISTRY/clouddeploy-backend:$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "frontend_tag_latest=$REGISTRY/clouddeploy-frontend:latest" >> $GITHUB_OUTPUT
          echo "frontend_tag_sha=$REGISTRY/clouddeploy-frontend:$COMMIT_SHA" >> $GITHUB_OUTPUT

          # Determine if registry pushing is active
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "can_push=true" >> $GITHUB_OUTPUT
          else
            echo "can_push=false" >> $GITHUB_OUTPUT
          fi

      - name: 4. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------
      # Container Builds
      # ----------------------------------------------------
      - name: 5. Build and Publish Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ steps.meta.outputs.can_push == 'true' }}
          load: ${{ steps.meta.outputs.can_push != 'true' }}
          tags: |
            ${{ steps.meta.outputs.backend_tag_latest }}
            ${{ steps.meta.outputs.backend_tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 6. Build and Publish Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ steps.meta.outputs.can_push == 'true' }}
          load: ${{ steps.meta.outputs.can_push != 'true' }}
          tags: |
            ${{ steps.meta.outputs.frontend_tag_latest }}
            ${{ steps.meta.outputs.frontend_tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------
      # Kubernetes Deployment Rollout
      # ----------------------------------------------------
      - name: 7. Setup Kubernetes CLI (kubectl)
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.2'

      - name: 8. Configure Kubernetes Cluster Context (if Kubeconfig provided)
        if: ${{ secrets.KUBE_CONFIG_DATA != '' }}
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          kubectl cluster-info

      - name: 9. Apply Kubernetes Platform Manifests
        if: ${{ secrets.KUBE_CONFIG_DATA != '' }}
        run: |
          kubectl apply -f ./k8s/namespace.yaml
          kubectl apply -f ./k8s/configmap.yaml
          kubectl apply -f ./k8s/secret.yaml
          kubectl apply -f ./k8s/postgres-service.yaml
          kubectl apply -f ./k8s/postgres-statefulset.yaml
          kubectl apply -f ./k8s/backend-service.yaml
          kubectl apply -f ./k8s/backend-deployment.yaml
          kubectl apply -f ./k8s/frontend-service.yaml
          kubectl apply -f ./k8s/frontend-deployment.yaml
          kubectl apply -f ./k8s/hpa.yaml
          kubectl apply -f ./k8s/ingress.yaml

      - name: 10. Update Kubernetes Deployment Images with Commit SHA
        if: ${{ secrets.KUBE_CONFIG_DATA != '' }}
        run: |
          kubectl set image deployment/clouddeploy-backend backend=${{ steps.meta.outputs.backend_tag_sha }} -n clouddeploy
          kubectl set image deployment/clouddeploy-frontend frontend=${{ steps.meta.outputs.frontend_tag_sha }} -n clouddeploy

      - name: 11. Await Rolling Update Rollout Status
        if: ${{ secrets.KUBE_CONFIG_DATA != '' }}
        run: |
          kubectl rollout status deployment/clouddeploy-backend -n clouddeploy --timeout=180s
          kubectl rollout status deployment/clouddeploy-frontend -n clouddeploy --timeout=180s

      - name: 12. Run Synthetic Health Verification Check
        if: ${{ secrets.KUBE_CONFIG_DATA != '' }}
        run: |
          kubectl wait --namespace clouddeploy --for=condition=ready pod --selector=app.kubernetes.io/name=clouddeploy-backend --timeout=90s
          BACKEND_POD=$(kubectl get pod -n clouddeploy -l app.kubernetes.io/name=clouddeploy-backend -o jsonpath="{.items[0].metadata.name}")
          kubectl exec -n clouddeploy $BACKEND_POD -- curl -f http://localhost:5000/health || exit 1
          echo "Kubernetes deployment release ${{ steps.meta.outputs.sha }} is healthy and serving production traffic!"
