name: CloudDeploy Continuous Integration (CI)

on:
  push:
    branches: [ main, develop, 'release/*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: 3. Install Backend Dependencies
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate

      - name: 4. Run Backend Automated Test Suites
        working-directory: ./backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret_key_12345
        run: npm test

      - name: 5. Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 6. Build Frontend Assets
        working-directory: ./frontend
        run: npm run build

      - name: 7. Validate Kubernetes Manifests Syntax
        run: |
          which kubectl > /dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq kubectl)
          kubectl apply --dry-run=client -k ./k8s/ || kubectl apply --dry-run=client -f ./k8s/
