apiVersion: apps/v1
kind: Deployment
metadata:
  name: clouddeploy-backend
  namespace: clouddeploy
  labels:
    app.kubernetes.io/name: clouddeploy-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: clouddeploy-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: clouddeploy-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clouddeploy-backend
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: backend
          image: clouddeploy/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: clouddeploy-config
            - secretRef:
                name: clouddeploy-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Kubernetes Health Probes (Section 13)
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
